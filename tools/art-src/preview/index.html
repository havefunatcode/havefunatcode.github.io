<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Art Preview</title>
<style>
  :root { --bg: #1e1f2b; --fg: #e8e4dc; --dim: #9a96a8; --line: #34364a; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, sans-serif; }
  header { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; }
  nav a { color: var(--dim); text-decoration: none; margin-right: 12px; }
  nav a.on { color: var(--fg); border-bottom: 2px solid var(--fg); }
  main { padding: 16px; }
  section[hidden] { display: none; }
  .row { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 20px; align-items: flex-start; }
  figure { margin: 0; }
  figcaption { color: var(--dim); font-size: 12px; margin-bottom: 4px; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  h2 { font-size: 14px; color: var(--dim); font-weight: 600; margin: 0 0 8px; }
  .hint { color: var(--dim); font-size: 12px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; align-items: start; }
  .cols > div { min-width: 0; border-left: 2px solid var(--line); padding-left: 12px; }
  .cols h3 { margin: 0 0 8px; font-size: 15px; }
  .cell canvas { border: 1px solid var(--line); background: #8fa3b8; }
  .cell { text-align: center; }
  .ctl { display: flex; gap: 8px; margin: 0 0 14px; flex-wrap: wrap; align-items: center; }
  .ctl button { background: #2b2d40; color: var(--fg); border: 1px solid var(--line); padding: 3px 10px; font: inherit; cursor: pointer; }
  .ctl button.on { background: var(--fg); color: var(--bg); }
</style>
</head>
<body>
<header>
  <h1>픽셀 아트 미리보기</h1>
  <nav id="tabs"></nav>
  <span class="hint">?tab=bg&amp;w=270|480|1100&amp;p=0|0.5|1&amp;s=배율</span>
</header>
<main id="main"></main>
<script type="module">
// 개발용 미리보기(빌드 없음, 외부 에셋 없음). 단계별 탭을 TABS에 추가해 확장한다.
import { drawBackground } from "../../../js/background.js";
import { VIEW_H, Game } from "../../../js/engine.js";
import { LEVEL } from "../../../js/level.js";
import { Sprites } from "../../../js/sprites.js";
import { baked } from "../../../js/art/bake.js";
import { PAL_TILE, GROUND, PLAT } from "../../../js/art/tiles.js";
import { COIN_FRAMES, PAL_COIN, CHEST_FRAMES, PAL_CHEST, CHEST_GLINT, CLOUDS, PAL_CLOUD, TREES, TREE_TONES } from "../../../js/art/props.js";
import { skyAt } from "../../../js/art/palette.js";
import { coinFrame, playerDrawRect, IDLE_STEP, WALK_FPS, WALK_FRAME_COUNT, LAND_MS } from "../../../js/anim.js";
import { PAL_PLAYER as PAL_CODIXEL, PLAYER_FRAMES as FR_CODIXEL } from "../player/codixel/frames.mjs";
import { PAL_PLAYER as PAL_PIXELBOLT, PLAYER_FRAMES as FR_PIXELBOLT } from "../player/pixelbolt/frames.mjs";
import { GLASSES_VARIANTS, GLASSES_PICK } from "../player/pixelbolt/glasses-variants.mjs";
import { PAL_PLAYER, PLAYER_FRAMES } from "../../../js/art/player.js";
import { createFrame, clearFrame, createFx, composite, painterFor, sparkle, hex } from "../../../js/vendor/pixelfx/core/index.js";
import * as fxCollectBurst from "../../../js/vendor/pixelfx/fx/pickups/collect-burst.js";
import * as fxHeavyLanding from "../../../js/vendor/pixelfx/fx/impacts/heavy-landing.js";
import { glint, twinkle } from "../../../js/vendor/pixelfx/fx/pickups/_lib.js";
import * as fxCoin from "../../../js/vendor/pixelfx/fx/custom/coin-burst-s.js";
import * as fxLand from "../../../js/vendor/pixelfx/fx/custom/land-dust-s.js";
import * as fxChest from "../../../js/vendor/pixelfx/fx/custom/chest-glint-s.js";
import { createFxLayer } from "../../../js/fx.js";

const q = new URLSearchParams(location.search);
const WIDTHS = [270, 480, 1100];
const PROGRESS = [[0, "저녁"], [0.5, "새벽"], [1, "오전"]];

function figure(label, w, scale, draw, h = VIEW_H) {
  const fig = document.createElement("figure");
  const cap = document.createElement("figcaption");
  cap.textContent = label;
  const cv = document.createElement("canvas");
  cv.width = w;
  cv.height = h;
  cv.style.width = w * scale + "px";
  cv.style.height = h * scale + "px";
  const ctx = cv.getContext("2d");
  ctx.imageSmoothingEnabled = false;
  draw(ctx);
  fig.append(cap, cv);
  return fig;
}

// ── M1: 배경 ─────────────────────────────────────────────────
function bgFigure(w, p, scale) {
  // 게임과 같은 카메라: 진행도 p = cam.x / (worldWidth - viewW)
  const cam = { x: p * Math.max(0, LEVEL.worldWidth - w), y: 0 };
  const name = PROGRESS.find(([v]) => v === p)?.[1] ?? "";
  return figure(`w=${w} · p=${p} ${name} · cam.x=${Math.round(cam.x)}`, w, scale, (ctx) =>
    drawBackground(ctx, cam, 0, w, p, true));
}
function renderBg(sec) {
  const w = q.has("w") ? +q.get("w") : null, p = q.has("p") ? +q.get("p") : null;
  if (w !== null || p !== null) {
    const row = document.createElement("div");
    row.className = "row";
    for (const ww of w !== null ? [w] : WIDTHS)
      for (const pp of p !== null ? [p] : PROGRESS.map(([v]) => v)) row.append(bgFigure(ww, pp, +(q.get("s") || 3)));
    sec.append(row);
    return;
  }
  const scale = +(q.get("s") || 2);
  for (const [pp, name] of PROGRESS) {
    const h = document.createElement("h2");
    h.textContent = `p=${pp} ${name}`;
    const row = document.createElement("div");
    row.className = "row";
    for (const ww of WIDTHS) row.append(bgFigure(ww, pp, scale));
    sec.append(h, row);
  }
}

// ── M2: 지면·발판 타일 ───────────────────────────────────────
function renderTiles(sec) {
  const sheet = [["top", GROUND.top], ["left", GROUND.left], ["right", GROUND.right], ["fill a", GROUND.fill[0]],
    ["fill b", GROUND.fill[1]], ["plat left", PLAT.left], ["plat mid", PLAT.mid], ["plat right", PLAT.right]];
  const h1 = document.createElement("h2");
  h1.textContent = "타일 시트 ×8";
  const row = document.createElement("div");
  row.className = "row";
  for (const [name, px] of sheet)
    row.append(figure(`${name} ${px[0].length}x${px.length}`, px[0].length, 8,
      (ctx) => ctx.drawImage(baked("pv." + name, px, PAL_TILE), 0, 0), px.length));
  // 게임과 같은 drawTile: 구덩이 340·760 + 계단 발판(56) 3개, 새벽 배경
  const h2 = document.createElement("h2");
  h2.textContent = "지면 + 발판 (월드 x 300~860, ×2)";
  const x0 = 300, w = 560;
  const strip = figure(`drawTile · 새벽`, w, +(q.get("s") || 2), (ctx) => {
    drawBackground(ctx, { x: x0, y: 0 }, 0, w, 0.5, true);
    ctx.translate(-x0, 0);
    for (const s of LEVEL.solids) Sprites.drawTile(ctx, s);
  });
  sec.append(h1, row, h2, strip);
}

// ── M2: 소품(코인·상자·구름·나무) + 실제 장면 ─────────────────
const reducedPv = q.get("reduced") === "1" || matchMedia("(prefers-reduced-motion: reduce)").matches;
const ticks = []; // requestAnimationFrame마다 (animT, dt)로 호출
function loop() {
  let last = performance.now(), animT = 0;
  const step = (now) => {
    const dt = Math.min((now - last) / 1000, 1 / 30);
    last = now;
    animT += dt;
    for (const f of ticks) f(animT, dt);
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function heading(sec, text) {
  const h = document.createElement("h2");
  h.textContent = text;
  sec.append(h);
}
function rowOf(sec, figs) {
  const row = document.createElement("div");
  row.className = "row";
  row.append(...figs);
  sec.append(row);
}
const sprite = (key, px, pal) => (ctx) => ctx.drawImage(baked(key, px, pal), 0, 0);
// 나무를 진행도 p의 skyAt 색으로(배경 나무 줄과 같은 키 매핑)
const treePal = (p) => {
  const s = skyAt(p), pal = { ".": null };
  for (const [k, name] of TREE_TONES) pal[k] = s[name];
  return pal;
};
function renderProps(sec) {
  const S = +(q.get("s") || 8);
  heading(sec, `코인 8x8 ×${S} — 6프레임 8fps${reducedPv ? " (reduced: 정면 고정)" : ""} · 정지 프레임 0~5`);
  const live = figure("animT 회전 + 흔들림", 8, S, () => {}, 12);
  const lctx = live.querySelector("canvas").getContext("2d");
  ticks.push((t) => {
    lctx.clearRect(0, 0, 8, 12);
    const f = coinFrame(t, reducedPv), bob = reducedPv ? 0 : Math.round(Math.sin(t * 4) * 1.5);
    lctx.drawImage(baked(`coin${f}`, COIN_FRAMES[f], PAL_COIN), 0, 2 + bob);
  });
  rowOf(sec, [live, ...COIN_FRAMES.map((f, i) => figure(`${i}`, 8, S, sprite(`coin${i}`, f, PAL_COIN), 8))]);

  heading(sec, `보물상자 32x28 ×${S} — 닫힘 / 열림1 / 열림2 / 열림+빛 · 닫힘+근접 반짝임`);
  const names = ["closed", "open1", "open2", "openGlow"];
  const near = figure("closed + near (1px 1Hz 점멸, reduced에서도)", 32, S, () => {}, 28);
  const nctx = near.querySelector("canvas").getContext("2d");
  ticks.push((t) => {
    nctx.clearRect(0, 0, 32, 28);
    Sprites.drawChest(nctx, { x: -6, y: -8, w: 44, h: 36 }, { opened: false, openT: 0, near: true }, t);
  });
  rowOf(sec, [...CHEST_FRAMES.map((f, i) => figure(names[i], 32, S, sprite(`chest${i}`, f, PAL_CHEST), 28)), near]);

  heading(sec, `구름 3종 ×${Math.max(2, S / 2)} (시간대 불변 색, 게임에선 cloudA 불투명도)`);
  rowOf(sec, CLOUDS.map((c, i) => figure(`cloud ${i} ${c[0].length}x${c.length}`, c[0].length, Math.max(2, S / 2), (ctx) => {
    ctx.fillStyle = "#b9c9dc";
    ctx.fillRect(0, 0, c[0].length, c.length);
    sprite(`cloud${i}`, c, PAL_CLOUD)(ctx);
  }, c.length)));

  heading(sec, `나무 ${TREES.length}종 ×${S} — 진행도 p=0 저녁 / 0.5 새벽 / 1 오전 (skyAt trunk·leaf·leafHi·leafSh)`);
  for (const [p, name] of PROGRESS) {
    const pal = treePal(p), s = skyAt(p);
    rowOf(sec, TREES.map((t, i) => figure(`p=${p} ${name} · tree ${i} ${t[0].length}x${t.length}`, t[0].length + 4, S, (ctx) => {
      ctx.fillStyle = s.near;
      ctx.fillRect(0, 0, t[0].length + 4, t.length + 2);
      ctx.drawImage(baked(`pv.tree${i}.${p}`, t, pal), 2, 2);
    }, t.length + 2)));
  }

  // 실제 장면: 진짜 Game + Sprites(오디오 스텁). title 상태로 두면 update가 animT만 올린다(물리 정지).
  const scale = +(q.get("ss") || 2);
  const scene = (w, label, setup) => {
    const fig = figure(label, w, scale, () => {});
    const ctx = fig.querySelector("canvas").getContext("2d");
    const g = new Game({ ctx, level: LEVEL, sprites: Sprites, audio: {}, input: {}, reduced: reducedPv });
    g.viewW = w;
    setup?.(g);
    ticks.push((t, dt) => { g.update(dt); g.render(); });
    return fig;
  };
  const atChest = (g) => {
    const c = LEVEL.chest;
    g.player.x = c.x + 4; g.player.y = 230 - g.player.h; g.player.grounded = true;
    g.cam.x = Math.max(0, Math.min(g.player.x + g.player.w / 2 - g.viewW / 2, LEVEL.worldWidth - g.viewW));
    g.atChest = true;
  };
  const startCam = (x) => (g) => { g.cam.x = Math.max(0, Math.min(x, LEVEL.worldWidth - g.viewW)); };
  heading(sec, `실제 장면 ×${scale} — 시작(cam 0)`);
  rowOf(sec, WIDTHS.map((w) => scene(w, `w=${w} · title · cam 0`)));
  heading(sec, `실제 장면 ×${scale} — 중간(계단 x≈880, 나무 줄·구름 패럴랙스)`);
  rowOf(sec, WIDTHS.map((w) => scene(w, `w=${w} · cam≈${880 - w / 2}`, startCam(880 - w / 2))));
  heading(sec, `실제 장면 ×${scale} — 상자 앞(near 반짝임) · 열림(modal)`);
  rowOf(sec, WIDTHS.map((w) => scene(w, `w=${w} · near`, atChest)));
  rowOf(sec, WIDTHS.map((w) => scene(w, `w=${w} · opened`, (g) => { atChest(g); g.state = "modal"; })));
  loop();
}

// ── M3: 플레이어 비교 (codixel vs Pixelbolt) ─────────────────
const PSETS = [
  { name: "codixel", pal: PAL_CODIXEL, fr: FR_CODIXEL },
  { name: "Pixelbolt", pal: PAL_PIXELBOLT, fr: FR_PIXELBOLT },
];
const PSTATES = ["idle", "walk", "jumpUp", "fall", "land"];
// §5.2 그리기: 앵커는 playerDrawRect, 좌향은 translate(flipX)+scale(-1,1)로 같은 16px 박스를 쓴다.
function drawPlayer(ctx, set, state, i, p) {
  if (!set.fr[state] || !set.fr[state][i]) throw new Error(`bad frame ${set.name} ${state} ${i}`);
  const img = baked(`pl.${set.name}.${state}${i}`, set.fr[state][i], set.pal);
  const r = playerDrawRect(p);
  if (p.facing < 0) {
    ctx.save();
    ctx.translate(r.flipX, r.y);
    ctx.scale(-1, 1);
    ctx.drawImage(img, 0, 0);
    ctx.restore();
  } else ctx.drawImage(img, r.x, r.y);
}
const BOX = (facing) => ({ x: 2, y: 4, w: 12, h: 20, facing }); // 16x24 캔버스 원점에 스프라이트가 오는 히트박스
// 상태·시각 t → 프레임 {state, i} (spec §5.2 표). land는 80ms 후 idle, 1.2초마다 재트리거.
function pframe(state, t) {
  t = Math.max(0, t); // 첫 rAF 타임스탬프가 loop() 시작보다 이를 수 있어 음수 방지
  if (state === "idle") return { state, i: reducedPv ? 0 : Math.floor(t / IDLE_STEP) % 2 };
  if (state === "walk") return { state, i: Math.floor(t * WALK_FPS) % WALK_FRAME_COUNT };
  if (state === "land") return (t % 1.2) < LAND_MS / 1000 ? { state, i: 0 } : { state: "idle", i: reducedPv ? 0 : Math.floor(t / IDLE_STEP) % 2 };
  return { state, i: 0 };
}
function cell(label, scale, draw, w = 16, h = 24) {
  const f = figure(label, w, scale, draw, h);
  f.className = "cell";
  return f;
}
// 장면 합성(160x150, 새벽, x=880 발판): 서있기(idle/walk/land) 우·좌 5명
function playerScene(set, scale, label = `×${scale} · 새벽 · 서있기(idle/walk/land) 우·좌`) {
  const W = 160, H = 150, X0 = 850, Y0 = 120;
  return figure(label, W, scale, (ctx) => {
    drawBackground(ctx, { x: X0, y: 0 }, 0, W, 0.5, true);
    ctx.save();
    ctx.translate(-X0, -Y0);
    const g = LEVEL.groundY; // 230
    const put = (x, st, i, facing) => drawPlayer(ctx, set, st, i, { x, y: g - 20, w: 12, h: 20, facing });
    put(856, "idle", 0, 1);
    put(870, "walk", 2, -1);
    put(884, "idle", 0, 1);
    put(900, "walk", 1, -1);
    put(916, "land", 0, 1);
    for (const s of LEVEL.solids) if (s.x < X0 + W && s.x + s.w > X0) Sprites.drawTile(ctx, s);
    ctx.restore();
  }, H);
}
// Pixelbolt 안경 변형(hand-refine.mjs GLASSES, --variants로 생성). 이름별로 ×8 · ×3 · 1x 장면.
function renderGlasses(sec, S) {
  const h = document.createElement("h3");
  h.textContent = `안경 변형 (Pixelbolt) — frames.mjs = ${GLASSES_PICK}`;
  h.style.margin = "28px 0 8px";
  sec.append(h);
  const grid = document.createElement("div");
  grid.className = "cols";
  grid.style.gridTemplateColumns = "repeat(auto-fit, minmax(300px, 1fr))";
  sec.append(grid);
  for (const [name, v] of Object.entries(GLASSES_VARIANTS)) {
    const set = { name: `gl.${name}`, pal: PAL_PIXELBOLT, fr: v.frames };
    const col = document.createElement("div");
    grid.append(col);
    const t = document.createElement("h3");
    t.textContent = `${name}${name === GLASSES_PICK ? " ★ 채택" : ""}`;
    col.append(t, Object.assign(document.createElement("div"), { className: "hint", textContent: v.label }));
    heading(col, `×${S} idle 0 · 우/좌`);
    rowOf(col, [1, -1].map((f) => cell(f > 0 ? "우향" : "좌향", S, (ctx) => drawPlayer(ctx, set, "idle", 0, BOX(f)))));
    heading(col, "×3 idle0 · walk1 · land · 좌향");
    rowOf(col, [["idle", 0, 1], ["walk", 1, 1], ["land", 0, 1], ["idle", 0, -1]].map(([st, i, f]) =>
      cell(`${st}${i ? " " + i : ""}`, 3, (ctx) => drawPlayer(ctx, set, st, i, BOX(f)))));
    heading(col, "1x 장면 / ×2");
    rowOf(col, [playerScene(set, 1, "×1"), playerScene(set, 2, "×2")]);
  }
}
function renderPlayer(sec) {
  const S = +(q.get("s") || 8);
  const ps = { facing: 1, pick: "walk" };
  const live = []; // {ctx, state|null, set}
  const ctl = document.createElement("div");
  ctl.className = "ctl";
  const fbtn = document.createElement("button");
  const setF = () => { fbtn.textContent = ps.facing > 0 ? "방향: 우향 →" : "방향: ← 좌향"; };
  fbtn.onclick = () => { ps.facing = -ps.facing; setF(); };
  setF();
  ctl.append(fbtn, Object.assign(document.createElement("span"), { textContent: "선택 상태:", className: "hint" }));
  const pbtns = PSTATES.map((st) => {
    const b = document.createElement("button");
    b.textContent = st;
    b.onclick = () => { ps.pick = st; pbtns.forEach((x) => x.classList.toggle("on", x === b)); };
    if (st === ps.pick) b.className = "on";
    ctl.append(b);
    return b;
  });
  sec.append(ctl);

  const cols = document.createElement("div");
  cols.className = "cols";
  sec.append(cols);
  for (const set of PSETS) {
    const col = document.createElement("div");
    cols.append(col);
    const h3 = document.createElement("h3");
    h3.textContent = set.name;
    col.append(h3);

    // 1) 프레임 시트 ×8: 우향/좌향 (같은 16px 박스)
    heading(col, `프레임 시트 ×${S} — 위 우향 / 아래 좌향(반전)`);
    for (const facing of [1, -1]) {
      const row = document.createElement("div");
      row.className = "row";
      row.style.gap = "8px";
      for (const st of PSTATES)
        set.fr[st].forEach((_, i) =>
          row.append(cell(`${st}${set.fr[st].length > 1 ? " " + i : ""}`, S, (ctx) => drawPlayer(ctx, set, st, i, BOX(facing)))));
      col.append(row);
    }

    // 2) 라이브 재생 ×8
    heading(col, `라이브 ×${S} — idle 0.5s/프레임 · walk 10fps · land 80ms→idle`);
    const row = document.createElement("div");
    row.className = "row";
    row.style.gap = "8px";
    for (const st of PSTATES) {
      const c = cell(st, S, () => {});
      live.push({ ctx: c.querySelector("canvas").getContext("2d"), state: st, set });
      row.append(c);
    }
    const sel = cell("선택(위 버튼)", S, () => {});
    live.push({ ctx: sel.querySelector("canvas").getContext("2d"), state: null, set });
    row.append(sel);
    col.append(row);

    // 3) 장면 합성: 실제 배경 + 지면/발판 타일, 그리기 순서 배경 → 플레이어 → 타일
    heading(col, "장면 — x=880 발판(y=194,h=14) 위·아래, 1x / 3x. 발판 밑 3명은 머리카락이 발판 뒤");
    const r2 = document.createElement("div");
    r2.className = "row";
    r2.append(playerScene(set, 1), playerScene(set, 3));
    col.append(r2);
  }
  renderGlasses(sec, S);
  ticks.push((t) => {
    for (const l of live) {
      l.ctx.clearRect(0, 0, 16, 24);
      const f = pframe(l.state || ps.pick, t);
      drawPlayer(l.ctx, l.set, f.state, f.i, BOX(ps.facing));
    }
  });
  loop();
}

// ── M4: 이펙트(pixelfx 원본 vs 축소 변형) ─────────────────────
const GAME_SET = { name: "game", pal: PAL_PLAYER, fr: PLAYER_FRAMES };
const FX_BG = "#b9c9dc"; // B.sky5[1] — 게임 하늘 톤 위에서 본다
const FX_GAP = 0.45; // 한 번 끝나고 다시 시작하기까지(초)
// 일회성 이펙트를 반복 재생하는 작은 플레이어: meta.size frame → 오프스크린 캔버스
function fxLooper(mod, opts = {}, layer) {
  const [w, h] = mod.meta.size, [ox, oy] = mod.meta.origin;
  const frame = createFrame(w, h, 0, 0), img = new ImageData(w, h);
  const cv = Object.assign(document.createElement("canvas"), { width: w, height: h }), cx = cv.getContext("2d");
  let fx = null, wait = 0;
  return {
    w, h, ox, oy, cv,
    step(dt) {
      if (!fx) fx = createFx(mod, { x: ox, y: oy, ...opts });
      else if (fx.done()) {
        if ((wait += dt) > FX_GAP) { fx = createFx(mod, { x: ox, y: oy, ...opts }); wait = 0; }
      } else fx.update(dt);
      clearFrame(frame);
      fx.draw(frame, layer); // 원본은 back+front 둘 다, 변형은 front만
      composite(frame, img.data, null);
      cx.putImageData(img, 0, 0);
    },
  };
}
// 패널: 배경색 + 16x24 플레이어(크기 비교) + 소품 + 이펙트. scale은 CSS 배율(1x/4x).
// pad로 이펙트 frame 둘레를 넓혀 플레이어·상자가 잘리지 않게 한다. playerAt·under는 이펙트 원점(ex, ey) 기준.
function fxPanel(label, L, scale, playerAt, { l = 0, t = 0, r = 0, b = 0, under } = {}) {
  const W = L.w + l + r, H = L.h + t + b, ex = l + L.ox, ey = t + L.oy;
  const fig = figure(label, W, scale, () => {}, H);
  const ctx = fig.querySelector("canvas").getContext("2d");
  return { fig, draw(now) {
    ctx.fillStyle = FX_BG;
    ctx.fillRect(0, 0, W, H);
    under?.(ctx, ex, ey, now);
    if (playerAt) {
      const [px, py] = playerAt(ex, ey);
      drawPlayer(ctx, GAME_SET, "idle", 0, { x: px, y: py, w: 12, h: 20, facing: 1 });
    }
    ctx.drawImage(L.cv, l, t);
  } };
}
// 열린 상자(32x28): 히트박스 원점 = 스폰점 − (22, 8)
const openChestUnder = (ctx, ex, ey, now) => Sprites.drawChest(ctx, { x: ex - 22, y: ey - 8, w: 44, h: 36 }, { opened: true, openT: 1 }, now);
// 원본 헬퍼(glint·twinkle·sparkle)를 그대로 그린 비교용 루프 — 심장 픽셀이 WHITE
function helperLooper() {
  const w = 48, h = 40, frame = createFrame(w, h, 0, 0), img = new ImageData(w, h);
  const cv = Object.assign(document.createElement("canvas"), { width: w, height: h }), cx = cv.getContext("2d");
  const C = ["#f53cd1", "#ff86e6"].map(hex); // pixelfx 기본(마젠타) 계열
  let t = 0;
  return { w, h, ox: 24, oy: 26, cv, step(dt) {
    t = (t + dt) % 1.2;
    const arm = Math.round(4 * Math.sin(Math.PI * Math.min(1, t / 0.8)));
    const p = painterFor(clearFrame(frame));
    glint(p, 10, 14, arm, C[0], 0.4);
    twinkle(p, 24, 14, arm + 1, C[0], C[1]);
    sparkle(p, 38, 14, arm, C[1], C[0], 0.6);
    composite(frame, img.data, null);
    cx.putImageData(img, 0, 0);
  } };
}

function renderFx(sec) {
  const note = document.createElement("p");
  note.className = "hint";
  note.textContent = reducedPv
    ? "reduced 모드(?reduced=1 또는 OS 설정): 게임 레이어(createFxLayer)의 spawn이 no-op → 아래 '실제 장면'에는 이펙트가 하나도 없다. 원본·변형 루프는 비교용이라 계속 재생."
    : "reduced 확인: 주소에 ?tab=fx&reduced=1 — 게임 레이어는 이펙트를 전부 끈다(아래 '실제 장면'이 비어야 정상). 원본·변형 루프는 비교용.";
  sec.append(note);

  const loopers = [];
  const pairs = [
    {
      title: "코인 획득 — 원본 pickups/collect-burst (112x108, 1.35s) vs coin-burst-s (44x44, 0.7s)",
      orig: fxLooper(fxCollectBurst), origPlayer: (x, y) => [x - 30, y - 20],
      vari: fxLooper(fxCoin, {}, "front"), variPlayer: (x, y) => [x - 16, y - 6],
    },
    {
      title: "착지 먼지 — 원본 impacts/heavy-landing (176x80, 1.6s) vs land-dust-s (40x18, 0.9s, impactVy 520)",
      orig: fxLooper(fxHeavyLanding), origPlayer: (x, y) => [x - 6, y - 20],
      vari: fxLooper(fxLand, {}, "front"), variPlayer: (x, y) => [x - 6, y - 20], pad: { t: 12 },
    },
    {
      title: "상자 반짝임 — 원본 헬퍼 glint · twinkle · core sparkle (WHITE 심장) vs chest-glint-s (48x40, 0.6s)",
      orig: helperLooper(), origPlayer: null,
      vari: fxLooper(fxChest, {}, "front"), variPlayer: (x, y) => [x - 40, y + 8], pad: { l: 20, b: 14, under: openChestUnder },
    },
  ];
  const panels = [];
  for (const pr of pairs) {
    heading(sec, pr.title);
    const row = document.createElement("div");
    row.className = "row";
    for (const [lab, L, pa, pad] of [["원본", pr.orig, pr.origPlayer], ["변형", pr.vari, pr.variPlayer, pr.pad]])
      for (const s of [1, 4]) {
        const P = fxPanel(`${lab} ${L.w}x${L.h} ×${s}${pa ? " · 16x24 플레이어" : ""}`, L, s, pa, pad);
        panels.push(P);
        row.append(P.fig);
      }
    sec.append(row);
    loopers.push(pr.orig, pr.vari);
  }
  // 착지 세기 비교: impactVy 250 / 520 / 820
  heading(sec, "land-dust-s 세기 ∝ impactVy — 250 · 520 · 820 (×4)");
  const r2 = document.createElement("div");
  r2.className = "row";
  for (const v of [250, 520, 820]) {
    const L = fxLooper(fxLand, { impactVy: v }, "front");
    const P = fxPanel(`impactVy ${v}`, L, 4, (x, y) => [x - 6, y - 20], { t: 12 });
    loopers.push(L);
    panels.push(P);
    r2.append(P.fig);
  }
  sec.append(r2);

  // 실제 장면: 진짜 createFxLayer + Sprites, 상자 앞(월드 x 2200~2420, y 160~240). 2.4초 주기로
  // 0.3s 코인 획득 → 0.9s 착지(impactVy 600) → 1.4s 상자 열림(0.6s)
  const X0 = 2200, Y0 = 160, W = 220, H = 80, CYC = 2.4;
  const coin = { x: 2300, y: 204 };
  const pl = { x: 2326, y: 230 - 20, w: 12, h: 20, facing: 1 };
  const scenes = [1, 3].map((s) => {
    const fig = figure(`실제 장면 ×${s} — createFxLayer({ reduced: ${reducedPv} })`, W, s, () => {}, H);
    return { fig, ctx: fig.querySelector("canvas").getContext("2d"), layer: createFxLayer({ reduced: reducedPv }), prev: 0 };
  });
  heading(sec, `실제 장면 — 코인 0.3s · 착지 0.9s · 상자 1.4s (${CYC}s 주기)`);
  const r3 = document.createElement("div");
  r3.className = "row";
  r3.append(...scenes.map((s) => s.fig));
  sec.append(r3);

  ticks.push((t, dt) => {
    for (const L of loopers) L.step(dt);
    for (const P of panels) P.draw(t);
    for (const S of scenes) {
      const c = t % CYC, prev = S.prev;
      const crossed = (at) => (prev < at && c >= at) || (prev > c && c >= at);
      if (crossed(0.3)) S.layer.spawn("coin", coin.x + 4, coin.y + 4);
      if (crossed(0.9)) S.layer.spawn("land", pl.x + pl.w / 2, pl.y + pl.h, { impactVy: 600 });
      if (crossed(1.4)) S.layer.spawn("chest", LEVEL.chest.x + 22, LEVEL.chest.y + 8);
      S.prev = c;
      S.layer.update(dt);
      const ctx = S.ctx;
      ctx.save();
      ctx.translate(0, -Y0);
      drawBackground(ctx, { x: X0, y: 0 }, t, W, 1, true);
      ctx.translate(-X0, 0);
      if (c < 0.3) Sprites.drawCoin(ctx, coin.x, coin.y, t);
      const opened = c >= 1.4, openT = Math.min(1, (c - 1.4) / 0.6);
      Sprites.drawChest(ctx, LEVEL.chest, { opened, openT, near: true }, t);
      const landing = c >= 0.9 && c < 0.98;
      drawPlayer(ctx, GAME_SET, landing ? "land" : "idle", 0, pl);
      for (const s of LEVEL.solids) if (s.x < X0 + W && s.x + s.w > X0) Sprites.drawTile(ctx, s);
      ctx.restore();
      ctx.save();
      ctx.translate(0, -Y0);
      S.layer.draw(ctx, { x: X0 });
      ctx.restore();
    }
  });
  loop();
}

// 탭 레지스트리: 이후 단계(소품 시트·플레이어 비교·이펙트)는 여기에 한 줄씩 추가.
const TABS = [
  { id: "bg", label: "M1 배경", render: renderBg },
  { id: "tiles", label: "M2 타일", render: renderTiles },
  { id: "props", label: "M2 소품", render: renderProps },
  { id: "player", label: "M3 플레이어 비교", render: renderPlayer },
  { id: "fx", label: "M4 이펙트", render: renderFx },
];

const cur = TABS.find((t) => t.id === q.get("tab")) || TABS[0];
const nav = document.getElementById("tabs"), main = document.getElementById("main");
for (const t of TABS) {
  const a = document.createElement("a");
  a.href = `?tab=${t.id}`;
  a.textContent = t.label;
  if (t === cur) a.className = "on";
  nav.append(a);
}
const sec = document.createElement("section");
sec.id = `tab-${cur.id}`;
main.append(sec);
cur.render(sec);
</script>
</body>
